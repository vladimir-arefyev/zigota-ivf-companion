    source_dated: null

- id: instr.trigger_exact_timing
  kind: instruction
  phase: 1
  topic: Take the trigger injection at the exact prescribed time
  aliases: [trigger shot timing, take trigger on time, missed trigger shot, точное время укола-триггера]
  body: >
    The trigger injection must be given at the exact time your clinic specifies, since egg
    retrieval is scheduled a fixed number of hours afterward. If it is given late, missed, or
    incorrectly, contact your clinic immediately rather than adjusting it yourself.
  unmet_action: escalate_to_clinic
  scope: in_scope
  confidence: agreed
  source:
    cite:
      - name: ASRM booklet
        ref: https://www.reproductivefacts.org/news-and-publications/fact-sheets-and-infographics/assisted-reproductive-technologies-booklet/
