    source_dated: "Mayo 2023"

- id: med.gnrh_agonist
  kind: medication
  phase: 1
  topic: GnRH agonists (suppression / premature-ovulation prevention)
  aliases: [GnRH agonist, Lupron, leuprolide, Synarel, Suprecur, agonist injection, агонист ГнРГ, люпрон]
  drug_class: gnrh_agonist
  names: [Lupron, Leuprolide, Synarel, Suprecur, Zoladex, Decapeptyl, Diphereline, Triptorelin]
  purpose: >
    Prevents the pituitary gland from triggering a premature LH surge and early ovulation
    during stimulation. Used in the long and flare protocols; can also be used as a trigger.
  alternatives_group: gnrh_agonist_class
  body: >
    A medication (injection or nasal spray) that suppresses natural ovulation signals so the
    ovaries can be stimulated on the clinic's schedule instead of the body's own cycle.
  scope: in_scope
  confidence: agreed
  source:
    cite:
      - name: SART
        ref: https://www.sart.org/patients/a-patients-guide-to-assisted-reproductive-technology/
        access: from_report
      - name: HFEA
