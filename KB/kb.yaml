- id: stage.protocol_flare
  kind: stage
  phase: 1
  topic: Short / flare agonist protocol
  aliases: [flare protocol, microdose flare, short agonist protocol, флэр-протокол]
  body: >
    A stimulation approach where the agonist is started at the beginning of the cycle,
    alongside or just before gonadotropins, using its initial stimulating effect to help
    recruit follicles early. Sometimes used for lower ovarian responders.
  scope: in_scope
  confidence: single_source
  source:
