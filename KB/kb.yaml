- id: stage.protocol_antagonist
  kind: stage
  phase: 1
  topic: GnRH antagonist protocol
  aliases: [antagonist protocol, short protocol, антагонист-протокол]
  body: >
    A stimulation approach where gonadotropin injections start first, and an antagonist
    medication is added partway through stimulation to prevent premature ovulation. It uses
    fewer injection days than the long agonist protocol.
  scope: in_scope
  confidence: single_source
