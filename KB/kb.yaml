- id: stage.fertilization
  kind: stage
  phase: 2
  topic: Fertilization (IVF vs ICSI)
  aliases: [fertilization step, how are eggs fertilized, IVF vs ICSI, оплодотворение]
  body: >
    Retrieved eggs are mixed with sperm (conventional insemination) or, if fertilization is
    less likely to succeed on its own, a single sperm is injected into each mature egg (ICSI).
    Usually 65-75% of mature eggs fertilize.
  scope: in_scope
  confidence: agreed
  source:
    cite:
      - name: ASRM booklet
        ref: https://www.reproductivefacts.org/news-and-publications/fact-sheets-and-infographics/assisted-reproductive-technologies-booklet/
