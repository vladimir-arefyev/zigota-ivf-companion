  kind: stage
  phase: 3
  topic: Luteal phase support
  aliases: [luteal support, progesterone after transfer, hormone support after transfer, поддержка лютеиновой фазы]
  body: >
    After transfer, progesterone (and sometimes estrogen) is given to help the uterine lining
    support a pregnancy. Support is continued until the pregnancy test, and further if the
    result is positive, per your clinic's plan.
