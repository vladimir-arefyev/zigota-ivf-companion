- id: stage.protocol_long_agonist
  kind: stage
  phase: 1
  topic: Long GnRH agonist protocol
  aliases: [long protocol, long agonist protocol, downregulation protocol, длинный протокол]
  body: >
    A stimulation approach where a daily agonist injection or nasal spray first suppresses
    natural hormone production for a couple of weeks; once suppression is confirmed by scan,
    gonadotropin stimulation begins.
  scope: in_scope
  confidence: single_source
  source:
