- id: stage.cycle_overview
  kind: stage
  phase: cross
  topic: Overall IVF cycle length
  aliases: [how long does IVF take, cycle length, duration of IVF, сколько длится цикл ЭКО]
  body: >
    A full IVF cycle covers ovarian stimulation, egg retrieval, fertilization, embryo transfer,
    and luteal support. Sources give different overall lengths depending on whether a
    suppression stage is included.
  scope: in_scope
  confidence: ranged
  value_range:
    metric: full_cycle_duration
    values:
