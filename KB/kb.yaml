- id: med.gonadotropin
  kind: medication
  phase: 1
  topic: Gonadotropins (ovarian stimulation)
  aliases: [gonadotropin, FSH injection, Gonal-F, Menopur, Puregon, Follistim, гонадотропины, менопур, гонал-ф]
  drug_class: gonadotropin
  names: [Menopur, Gonal-F, Puregon, Follistim, Bravelle, Repronex]
  purpose: >
    Stimulates the ovaries to grow multiple follicles/eggs during a treatment cycle, instead of
    the single egg that develops in a natural cycle.
  alternatives_group: gonadotropin_injectable
  body: >
    An injectable hormone medication (FSH, sometimes combined with LH) that drives the ovaries
    to grow several eggs at once. Given daily during the stimulation phase; your clinic chooses
    the specific product.
  scope: in_scope
  confidence: agreed
  source:
