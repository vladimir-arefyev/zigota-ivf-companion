- id: stage.embryo_culture
  kind: stage
  phase: 2
  topic: Embryo culture
  aliases: [embryo culture, embryo development in lab, культивирование эмбрионов]
  body: >
    Fertilized eggs are grown in the lab for several days. By day 3 an embryo usually has about
    6-10 cells; by day 5 it may reach the blastocyst stage. Embryos can be transferred any time
    from day 1 to day 6 after retrieval.
  scope: in_scope
  confidence: agreed
  source:
