  kind: stage
  phase: 3
  topic: Embryo transfer
  aliases: [embryo transfer, transfer procedure, перенос эмбриона]
  body: >
    A thin catheter guided through the cervix places one or more embryos into the uterus. No
    anesthesia is usually needed, though a mild sedative is an option; some cramping is common.
    Timing after retrieval varies by source.
  scope: in_scope
