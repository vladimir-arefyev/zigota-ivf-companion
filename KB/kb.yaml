- id: stage.egg_retrieval_procedure
  kind: stage
  phase: 2
  topic: Egg retrieval procedure
  aliases: [egg collection procedure, what happens during egg retrieval, забор яйцеклеток процедура]
  body: >
    Using ultrasound guidance, a thin needle is passed through the vagina into each follicle to
    draw out the fluid and egg. The procedure usually takes under 30 minutes and is done with
    sedation or pain medication; cramping and fullness afterward are common.
  scope: in_scope
  confidence: agreed
  source:
