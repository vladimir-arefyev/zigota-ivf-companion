      - name: ASRM booklet
        ref: https://www.reproductivefacts.org/news-and-publications/fact-sheets-and-infographics/assisted-reproductive-technologies-booklet/
        access: live
  review:
    validated_by: null
    reviewed_on: null
    source_dated: "Mayo 2023; ASRM 2015/2018 ed."

- id: glossary.ohss_term
  kind: glossary
  phase: cross
  topic: OHSS (ovarian hyperstimulation syndrome)
  aliases: [OHSS, ovarian hyperstimulation syndrome, гиперстимуляция яичников]
  body: >
    A condition that can occur after ovarian stimulation, in which the ovaries become swollen
    and painful and fluid can build up in the body. Most cases are mild; it's rarely severe.
  scope: in_scope
  confidence: agreed
  source:
    cite:
      - name: Mayo Clinic
        ref: https://www.mayoclinic.org/tests-procedures/in-vitro-fertilization/about/pac-20384716
        access: live
      - name: NHS
        ref: https://www.nhs.uk/tests-and-treatments/ivf/
        access: live
  review:
    validated_by: null
    reviewed_on: null
    source_dated: "Mayo 2023; NHS 2025"

- id: glossary.frozen_embryo_transfer
  kind: glossary
  phase: 3
  topic: Frozen embryo transfer (FET)
  aliases: [FET, frozen embryo transfer, криоперенос]
  body: >
    A cycle in which a previously frozen embryo is thawed and transferred to the uterus,
    separate from the original stimulation and retrieval cycle.
  scope: in_scope
  confidence: agreed
  source:
    cite:
      - name: MedlinePlus
        ref: https://medlineplus.gov/ency/article/007279.htm
        access: live
      - name: SART
        ref: https://www.sart.org/patients/a-patients-guide-to-assisted-reproductive-technology/
        access: from_report
  review:
    validated_by: null
    reviewed_on: null
    source_dated: "MedlinePlus 2026"

- id: glossary.ovarian_reserve
  kind: glossary
  phase: 1
  topic: Ovarian reserve
  aliases: [ovarian reserve, AMH, antral follicle count, овариальный резерв]
  body: >
    A general measure of a woman's remaining egg supply, assessed before a cycle using blood
    tests (such as AMH) and an ultrasound count of small follicles (antral follicle count).
  scope: in_scope
  confidence: agreed
  source:
    cite:
      - name: ASRM booklet
        ref: https://www.reproductivefacts.org/news-and-publications/fact-sheets-and-infographics/assisted-reproductive-technologies-booklet/
        access: live
  review:
    validated_by: null
    reviewed_on: null
    source_dated: "2015/2018 ed."

