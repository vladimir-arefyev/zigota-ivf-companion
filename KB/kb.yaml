    now: AVA-Peter emergency line for ART patients +7 (921) 753-17-38 (20:00-08:00), dispatcher
    +7 (812) 600-77-78 (08:00-20:00). If you cannot reach them or feel very unwell, seek urgent
    medical care immediately.
  scope: in_scope
  confidence: agreed
