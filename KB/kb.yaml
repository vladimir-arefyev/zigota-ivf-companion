# ---------- glossary ----------

- id: glossary.follicle
  kind: glossary
  phase: 1
  topic: Follicle
  aliases: [follicle, follicles, egg sac, фолликул]
  body: >
    A fluid-filled structure in the ovary that contains an egg and the cells that produce
    hormones. During stimulation, several follicles are encouraged to grow and are tracked by
    ultrasound.
  scope: in_scope
  confidence: agreed
  source:
    cite:
      - name: ASRM booklet
        ref: https://www.reproductivefacts.org/news-and-publications/fact-sheets-and-infographics/assisted-reproductive-technologies-booklet/
        access: live
      - name: Mayo Clinic
        ref: https://www.mayoclinic.org/tests-procedures/in-vitro-fertilization/about/pac-20384716
        access: live
  review:
    validated_by: null
    reviewed_on: null
    source_dated: "2015/2018 ed.; Mayo 2023"

- id: glossary.oocyte
  kind: glossary
  phase: 1
  topic: Oocyte / egg
  aliases: [oocyte, egg, ovum, яйцеклетка]
  body: >
    The female sex cell (ovum) produced by the ovary. In an IVF cycle, mature eggs are
    collected at egg retrieval so they can be fertilized in the lab.
  scope: in_scope
  confidence: agreed
  source:
    cite:
      - name: ASRM booklet
        ref: https://www.reproductivefacts.org/news-and-publications/fact-sheets-and-infographics/assisted-reproductive-technologies-booklet/
        access: live
  review:
    validated_by: null
    reviewed_on: null
    source_dated: "2015/2018 ed."

- id: glossary.estradiol
  kind: glossary
  phase: 1
  topic: Estradiol
  aliases: [estradiol, estrogen level, эстрадиол]
  body: >
    The main estrogen hormone made by the growing follicles. Its level is checked by blood
    test during stimulation and normally rises as follicles develop.
  scope: in_scope
  confidence: agreed
  source:
    cite:
      - name: ASRM booklet
        ref: https://www.reproductivefacts.org/news-and-publications/fact-sheets-and-infographics/assisted-reproductive-technologies-booklet/
        access: live
      - name: Mayo Clinic
        ref: https://www.mayoclinic.org/tests-procedures/in-vitro-fertilization/about/pac-20384716
        access: live
  review:
    validated_by: null
    reviewed_on: null
    source_dated: "2015/2018 ed.; Mayo 2023"

- id: glossary.egg_retrieval
  kind: glossary
  phase: 2
  topic: Egg retrieval / oocyte aspiration
  aliases: [egg retrieval, oocyte aspiration, follicular aspiration, transvaginal ultrasound aspiration, пункция фолликулов]
  body: >
    The procedure in which eggs are collected by guiding a thin needle through the vagina into
    each ovarian follicle and drawing out the fluid and egg with gentle suction, using
    ultrasound to guide the needle.
  scope: in_scope
  confidence: agreed
  source:
    cite:
      - name: ASRM booklet
        ref: https://www.reproductivefacts.org/news-and-publications/fact-sheets-and-infographics/assisted-reproductive-technologies-booklet/
        access: live
      - name: MedlinePlus
        ref: https://medlineplus.gov/ency/article/007279.htm
        access: live
  review:
    validated_by: null
    reviewed_on: null
    source_dated: "2015/2018 ed.; MedlinePlus 2026"

- id: glossary.icsi
  kind: glossary
  phase: 2
  topic: ICSI (intracytoplasmic sperm injection)
  aliases: [ICSI, sperm injection, ИКСИ]
  body: >
    A lab technique in which a single sperm is injected directly into a mature egg, used mainly
    when fertilization by mixing sperm and egg together is less likely to succeed.
  scope: in_scope
  confidence: agreed
  source:
    cite:
      - name: ASRM booklet
        ref: https://www.reproductivefacts.org/news-and-publications/fact-sheets-and-infographics/assisted-reproductive-technologies-booklet/
        access: live
      - name: Mayo Clinic
        ref: https://www.mayoclinic.org/tests-procedures/in-vitro-fertilization/about/pac-20384716
        access: live
  review:
    validated_by: null
    reviewed_on: null
    source_dated: "2015/2018 ed.; Mayo 2023"

- id: glossary.embryo
  kind: glossary
  phase: 2
  topic: Embryo
  aliases: [embryo, fertilized egg, эмбрион]
  body: >
    A fertilized egg that has begun dividing into cells. Embryos are grown in the lab (embryo
    culture) for a few days before transfer or freezing.
  scope: in_scope
  confidence: agreed
  source:
    cite:
      - name: ASRM booklet
        ref: https://www.reproductivefacts.org/news-and-publications/fact-sheets-and-infographics/assisted-reproductive-technologies-booklet/
        access: live
  review:
    validated_by: null
    reviewed_on: null
    source_dated: "2015/2018 ed."

- id: glossary.blastocyst
  kind: glossary
  phase: 2
  topic: Blastocyst
  aliases: [blastocyst, day 5 embryo, бластоциста]
  body: >
    An embryo that has developed a fluid-filled cavity, usually by day 5 after egg retrieval,
    when the cells begin separating into the parts that will form the placenta and the embryo.
  scope: in_scope
  confidence: agreed
  source:
    cite:
      - name: ASRM booklet
        ref: https://www.reproductivefacts.org/news-and-publications/fact-sheets-and-infographics/assisted-reproductive-technologies-booklet/
        access: live
      - name: Mayo Clinic
        ref: https://www.mayoclinic.org/tests-procedures/in-vitro-fertilization/about/pac-20384716
        access: live
  review:
    validated_by: null
    reviewed_on: null
    source_dated: "2015/2018 ed.; Mayo 2023"

- id: glossary.zona_pellucida
  kind: glossary
  phase: 2
  topic: Zona pellucida / assisted hatching
  aliases: [zona pellucida, assisted hatching, зона пеллюцида]
  body: >
    The zona pellucida is the egg's outer shell, which a sperm must penetrate and which the
    embryo must later break out of ("hatch") to implant. Assisted hatching is a lab technique
    that opens this shell slightly before transfer to help that process.
  scope: in_scope
  confidence: agreed
  source:
    cite:
      - name: ASRM booklet
        ref: https://www.reproductivefacts.org/news-and-publications/fact-sheets-and-infographics/assisted-reproductive-technologies-booklet/
        access: live
  review:
    validated_by: null
    reviewed_on: null
    source_dated: "2015/2018 ed."

- id: glossary.hcg
  kind: glossary
  phase: cross
  topic: hCG (human chorionic gonadotropin)
  aliases: [hCG, human chorionic gonadotropin, ХГЧ]
  body: >
    A hormone that, in medication form, triggers final egg maturation before retrieval. hCG is
    also the hormone produced by an early pregnancy and is what pregnancy blood tests measure.
  scope: in_scope
  confidence: agreed
  source:
    cite:
      - name: ASRM booklet
        ref: https://www.reproductivefacts.org/news-and-publications/fact-sheets-and-infographics/assisted-reproductive-technologies-booklet/
        access: live
  review:
    validated_by: null
    reviewed_on: null
    source_dated: "2015/2018 ed."

- id: glossary.beta_hcg
  kind: glossary
  phase: 3
  topic: Beta-hCG (pregnancy blood test)
  aliases: [beta-hCG, pregnancy blood test, quantitative hCG test, бета-ХГЧ]
  body: >
    A blood test that measures the level of hCG hormone to confirm and monitor an early
    pregnancy after embryo transfer. It's done on a specific day set by the clinic.
  scope: in_scope
  confidence: agreed
  source:
    cite:
      - name: MedlinePlus
        ref: https://medlineplus.gov/ency/article/007279.htm
        access: live
      - name: NHS
        ref: https://www.nhs.uk/tests-and-treatments/ivf/
        access: live
  review:
    validated_by: null
    reviewed_on: null
    source_dated: "MedlinePlus 2026; NHS 2025"

- id: glossary.progesterone_term
  kind: glossary
  phase: 3
  topic: Progesterone
  aliases: [progesterone, luteal hormone, прогестерон]
  body: >
    A hormone that prepares and maintains the lining of the uterus so a fertilized egg can
    attach and grow. It's supplemented after embryo transfer as part of luteal support.
  scope: in_scope
  confidence: agreed
  source:
    cite:
      - name: MedlinePlus
        ref: https://medlineplus.gov/ency/article/007279.htm
        access: live
  review:
    validated_by: null
    reviewed_on: null
    source_dated: "MedlinePlus 2026"

- id: glossary.luteal_phase
  kind: glossary
  phase: 3
  topic: Luteal phase
  aliases: [luteal phase, luteal support phase, лютеиновая фаза]
  body: >
    The period after egg retrieval (and, in a natural cycle, after ovulation) during which the
    uterine lining is prepared for a possible pregnancy, typically supported with progesterone
    medication in IVF.
  scope: in_scope
  confidence: agreed
  source:
    cite:
      - name: SART
        ref: https://www.sart.org/patients/a-patients-guide-to-assisted-reproductive-technology/
        access: from_report
  review:
    validated_by: null
    reviewed_on: null
    source_dated: null

- id: glossary.gnrh_agonist_term
  kind: glossary
  phase: 1
  topic: GnRH agonist
  aliases: [GnRH agonist, Lupron, agonist protocol drug, агонист ГнРГ]
  body: >
    A medication that first briefly stimulates, then suppresses, the pituitary gland's hormone
    signals, used to prevent the ovaries from releasing eggs too early during stimulation.
  scope: in_scope
  confidence: agreed
  source:
    cite:
      - name: SART
        ref: https://www.sart.org/patients/a-patients-guide-to-assisted-reproductive-technology/
        access: from_report
  review:
    validated_by: null
    reviewed_on: null
    source_dated: null

- id: glossary.gnrh_antagonist_term
  kind: glossary
  phase: 1
  topic: GnRH antagonist
  aliases: [GnRH antagonist, Cetrotide, Orgalutran, antagonist protocol drug, антагонист ГнРГ]
  body: >
    A medication that immediately blocks the pituitary gland's hormone signal to prevent
    premature ovulation. It's usually started partway through stimulation.
  scope: in_scope
  confidence: agreed
  source:
    cite:
      - name: SART
        ref: https://www.sart.org/patients/a-patients-guide-to-assisted-reproductive-technology/
        access: from_report
  review:
    validated_by: null
    reviewed_on: null
    source_dated: null

- id: glossary.gonadotropins_term
  kind: glossary
  phase: 1
  topic: Gonadotropins (FSH/LH)
  aliases: [gonadotropins, FSH, LH, follicle-stimulating hormone, luteinizing hormone, гонадотропины]
  body: >
    Injectable hormones (follicle-stimulating hormone and/or luteinizing hormone) that
    stimulate the ovaries to grow multiple eggs during a treatment cycle.
  scope: in_scope
  confidence: agreed
  source:
    cite:
      - name: Mayo Clinic
        ref: https://www.mayoclinic.org/tests-procedures/in-vitro-fertilization/about/pac-20384716
