        ref: https://www.sart.org/patients/a-patients-guide-to-assisted-reproductive-technology/
        access: from_report
  review:
    validated_by: null
    reviewed_on: null
    source_dated: "ASRM 2015/2018 ed."

- id: instr.pregnancy_test_on_assigned_date
  kind: instruction
  phase: 3
  topic: Take the pregnancy test on the assigned date
  aliases: [when to test for pregnancy, don't test early, test on the date given, тест на беременность в назначенный день]
  body: >
    Take your pregnancy blood test only on the date your clinic assigns. Testing earlier can
    give an inaccurate result — a false positive from residual trigger medication, or a false
    negative if levels are still too low.
  unmet_action: escalate_to_clinic
  scope: in_scope
  confidence: agreed
  source:
