# ---------- instruction ----------

- id: instr.fasting_before_retrieval
  kind: instruction
  phase: 2
  topic: Fasting before egg retrieval
  aliases: [fasting, empty stomach, no food before retrieval, nil by mouth, натощак, не есть перед пункцией]
  body: >
    Because egg retrieval is done under sedation, you are asked not to eat or drink for a set
    period beforehand, as instructed by your clinic. Arriving without fasting can mean the
    procedure has to be postponed.
  unmet_action: escalate_to_clinic
  scope: in_scope
  confidence: agreed
  source:
    cite:
      - name: Mayo Clinic
        ref: https://www.mayoclinic.org/tests-procedures/in-vitro-fertilization/about/pac-20384716
        access: live
  review:
    validated_by: null
    reviewed_on: null
    source_dated: "Mayo 2023"

- id: instr.no_driving_after_sedation
  kind: instruction
  phase: 2
  topic: No driving after sedation
  aliases: [no driving after retrieval, need a ride home, can't drive after sedation, нельзя за руль после пункции]
  body: >
    Because a sedative is used for egg retrieval, you cannot drive yourself home afterward. A
    responsible adult should take you home, and you should avoid driving or operating machinery
    for the rest of the day.
  unmet_action: escalate_to_clinic
  scope: in_scope
  confidence: single_source
  source:
    cite:
      - name: ASRM booklet
        ref: https://www.reproductivefacts.org/news-and-publications/fact-sheets-and-infographics/assisted-reproductive-technologies-booklet/
        access: live
  review:
    validated_by: null
    reviewed_on: null
    source_dated: "2015/2018 ed."

- id: instr.rest_after_retrieval
  kind: instruction
  phase: 2
  topic: Activity limits after egg retrieval
  aliases: [rest after retrieval, activity restrictions, avoid strenuous exercise after retrieval, ограничение активности после пункции]
  body: >
    Expect cramping and a feeling of fullness for some time after retrieval because the ovaries
    remain enlarged. Vigorous activity and sex should be avoided until your clinic advises it's
    fine to resume.
  unmet_action: escalate_to_clinic
  scope: in_scope
  confidence: single_source
  source:
    cite:
      - name: ASRM booklet
        ref: https://www.reproductivefacts.org/news-and-publications/fact-sheets-and-infographics/assisted-reproductive-technologies-booklet/
        access: live
  review:
    validated_by: null
    reviewed_on: null
    source_dated: "2015/2018 ed."

- id: instr.partner_abstinence
  kind: instruction
  phase: 2
  topic: Partner ejaculatory abstinence before sample
  aliases: [abstinence before semen sample, days without ejaculation before IVF, воздержание перед сдачей спермы]
  body: >
    Your partner may be asked to abstain from ejaculation for a set number of days before
    giving the semen sample used on retrieval day, as instructed by the clinic's lab.
  unmet_action: escalate_to_clinic
  scope: in_scope
  confidence: single_source
