    source_dated: "Mayo 2023; NHS 2025; HFEA 2016 (ongoing)"

- id: stage.ovarian_stimulation
  kind: stage
  phase: 1
  topic: Ovarian stimulation
  aliases: [ovarian stimulation, superovulation, stimulation phase, стимуляция яичников]
  body: >
    Daily hormone injections encourage the ovaries to grow several eggs instead of the single
    egg that develops naturally each month. Progress is tracked with vaginal ultrasounds and
    blood tests.
  scope: in_scope
  confidence: ranged
  value_range:
    metric: stimulation_duration_days
    values:
      - source: ASRM booklet
        value: "8-14 days"
      - source: SART
        value: "8-10 days (most women)"
      - source: Mayo Clinic
        value: "1-2 weeks"
  source:
    cite:
      - name: ASRM booklet
        ref: https://www.reproductivefacts.org/news-and-publications/fact-sheets-and-infographics/assisted-reproductive-technologies-booklet/
        access: live
      - name: SART
        ref: https://www.sart.org/patients/a-patients-guide-to-assisted-reproductive-technology/
        access: from_report
      - name: Mayo Clinic
        ref: https://www.mayoclinic.org/tests-procedures/in-vitro-fertilization/about/pac-20384716
        access: live
  review:
    validated_by: null
    reviewed_on: null
    source_dated: "ASRM 2015/2018 ed.; Mayo 2023"

- id: stage.monitoring
  kind: stage
  phase: 1
  topic: Monitoring during stimulation
  aliases: [ultrasound monitoring, blood test monitoring, follicle tracking, мониторинг цикла]
  body: >
    While stimulating, you'll have repeated vaginal ultrasounds to track follicle growth and
    blood tests to check hormone response. Estrogen typically rises as follicles grow, while
    progesterone stays low until after ovulation.
  scope: in_scope
  confidence: agreed
  source:
    cite:
      - name: ASRM booklet
        ref: https://www.reproductivefacts.org/news-and-publications/fact-sheets-and-infographics/assisted-reproductive-technologies-booklet/
        access: live
      - name: Mayo Clinic
        ref: https://www.mayoclinic.org/tests-procedures/in-vitro-fertilization/about/pac-20384716
        access: live
  review:
    validated_by: null
    reviewed_on: null
    source_dated: "ASRM 2015/2018 ed.; Mayo 2023"

- id: stage.cycle_cancellation
  kind: stage
  phase: 1
  topic: Cycle cancellation before retrieval
  aliases: [cancelled cycle, cycle cancellation, why was my cycle cancelled, отмена цикла]
  body: >
    A cycle may be cancelled before egg retrieval, most often because too few follicles are
    developing; other reasons include premature ovulation or an excessive response raising OHSS
    risk. Up to about 20% of cycles are cancelled before retrieval.
  scope: in_scope
  confidence: single_source
  source:
    cite:
      - name: ASRM booklet
        ref: https://www.reproductivefacts.org/news-and-publications/fact-sheets-and-infographics/assisted-reproductive-technologies-booklet/
        access: live
  review:
    validated_by: null
    reviewed_on: null
    source_dated: "2015/2018 ed."

- id: stage.trigger
  kind: stage
  phase: 1
  topic: Trigger injection
  aliases: [trigger shot, hCG trigger, trigger injection, укол-триггер]
  body: >
    When follicles are mature, a "trigger" injection (hCG or another medication) causes the
    eggs to finish maturing so they can be retrieved. Its exact timing is set by your clinic
    and is critical — egg retrieval is scheduled a fixed time afterward.
  scope: in_scope
  confidence: agreed
  source:
    cite:
      - name: ASRM booklet
        ref: https://www.reproductivefacts.org/news-and-publications/fact-sheets-and-infographics/assisted-reproductive-technologies-booklet/
        access: live
      - name: SART
        ref: https://www.sart.org/patients/a-patients-guide-to-assisted-reproductive-technology/
        access: from_report
  review:
    validated_by: null
    reviewed_on: null
    source_dated: "ASRM 2015/2018 ed."

- id: stage.trigger_to_retrieval_window
  kind: stage
  phase: 2
  topic: Trigger-to-retrieval timing window
  aliases: [trigger to retrieval time, when is retrieval after trigger, hours after trigger shot, время от триггера до пункции]
  body: >
    Egg retrieval is scheduled a set number of hours after the trigger injection, timed to
    happen just before natural ovulation would occur. Sources give slightly different windows.
